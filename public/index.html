<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة الوكلاء</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الوكلاء">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f766e">
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1c1f24; --muted:#6b7280; --line:#e5e7eb; --accent:#0f766e; --warn:#b45309; --bad:#b91c1c; --soft:#eef7f6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111317; --card:#1b1e24; --text:#eef0f3; --muted:#9aa1ab; --line:#2a2f37; --accent:#2dd4bf; --warn:#f59e0b; --bad:#f87171; --soft:#16302d; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Tahoma,sans-serif; }
  header { padding:16px; padding-top:max(16px, env(safe-area-inset-top)); display:flex; justify-content:space-between; align-items:center; max-width:960px; margin:auto; }
  h1 { font-size:20px; margin:0; }
  main { padding:0 16px 40px; max-width:960px; margin:auto; }
  .stats { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:14px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; text-align:center; }
  .stat b { display:block; font-size:22px; }
  .stat span { color:var(--muted); font-size:12px; }
  .tabs { display:flex; gap:6px; margin-bottom:12px; overflow-x:auto; padding-bottom:4px; }
  .tabs button { white-space:nowrap; }
  button { border:1px solid var(--line); background:var(--card); color:var(--text); padding:9px 12px; border-radius:10px; font-size:14px; cursor:pointer; font-family:inherit; }
  button.on, button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.danger { color:var(--bad); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; }
  .meta { color:var(--muted); font-size:12px; margin-bottom:6px; }
  .tag { color:var(--warn); font-weight:600; }
  textarea, input { width:100%; border:1px solid var(--line); border-radius:8px; padding:9px; background:var(--bg); color:var(--text); font:inherit; }
  textarea { min-height:80px; margin:8px 0; }
  .row { display:flex; gap:8px; align-items:center; }
  .row input { flex:1; }
  .empty { color:var(--muted); text-align:center; padding:30px; }
  pre { white-space:pre-wrap; font:inherit; margin:0; }
  .chat { max-height:55vh; overflow-y:auto; display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
  .bubble { padding:9px 12px; border-radius:12px; max-width:85%; white-space:pre-wrap; line-height:1.6; }
  .me, .customer { background:var(--soft); align-self:flex-start; }
  .agent { background:var(--accent); color:#fff; align-self:flex-end; }
  .note { background:transparent; border:1px dashed var(--warn); color:var(--warn); align-self:center; font-size:13px; }
  .hint { color:var(--muted); font-size:13px; margin:0 0 10px; line-height:1.7; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .chips button { font-size:12px; padding:6px 10px; }
  .team { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px; margin-bottom:14px; }
  .agent-card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; cursor:pointer; transition:transform .15s; }
  .agent-card:hover { transform:translateY(-2px); border-color:var(--accent); }
  .agent-card .top { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .agent-card .ic { font-size:24px; width:44px; height:44px; display:grid; place-items:center; border-radius:12px; background:var(--soft); }
  .agent-card h3 { margin:0; font-size:15px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#22c55e; margin-inline-end:4px; box-shadow:0 0 0 3px rgba(34,197,94,.2); }
  .dot.wait { background:#f59e0b; box-shadow:0 0 0 3px rgba(245,158,11,.2); }
  .big { font-size:26px; font-weight:700; }
  .banner { border-radius:12px; padding:12px 14px; margin-bottom:12px; font-size:14px; line-height:1.7; }
  .banner.warn { background:rgba(245,158,11,.12); border:1px solid rgba(245,158,11,.4); }
  .banner.ok { background:rgba(34,197,94,.1); border:1px solid rgba(34,197,94,.35); }
  .feed div { padding:7px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .feed div:last-child { border:0; }
  @media (max-width:600px) { .stats { grid-template-columns:repeat(3,1fr); } }
</style>
</head>
<body>
<header><h1>لوحة الوكلاء</h1><button onclick="load().then(render)">تحديث</button></header>
<main>
  <div class="stats" id="stats"></div>
  <div class="tabs" id="tabs"></div>
  <section id="view"></section>
</main>
<script>
const TABS = [['team','👥 الفريق'],['manager','🧠 مدير الفريق'],['pending','🟡 الموافقات'],['appts','📅 المواعيد'],['test','🧪 تجربة عميل'],['convs','💬 المحادثات'],['report','📊 التقرير'],['settings','⚙️ معلومات النشاط']];
let state = null, current = 'team', ownerChat = null, testChat = [];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const time = t => t ? new Date(t).toLocaleString('ar-SA', { hour:'2-digit', minute:'2-digit', day:'numeric', month:'short' }) : '';
async function api(url, body, method) {
  const opts = (body !== undefined || method) ? { method: method || 'POST', headers: {'Content-Type':'application/json'}, body: body !== undefined ? JSON.stringify(body) : undefined } : {};
  return (await fetch(url, opts)).json();
}

async function load() {
  state = await api('/api/state');
  state.appts = await api('/api/appointments');
  const s = state.stats, upcoming = state.appts.filter(a => new Date(a.at) > Date.now()).length;
  document.getElementById('stats').innerHTML = [
    ['رسائل اليوم', s.incoming], ['ردود تلقائية', s.auto], ['موافقات', s.approved], ['معلّق', s.pending], ['مواعيد قادمة', upcoming]
  ].map(([l, v]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
  document.getElementById('tabs').innerHTML = TABS.map(([k, l]) => `<button class="${k === current ? 'on' : ''}" onclick="tab('${k}')">${l}</button>`).join('');
}
async function tab(t) { current = t; await load(); render(); }

async function render() {
  const v = document.getElementById('view');
  if (current === 'team') {
    const t = await api('/api/team');
    const wa = t.whatsapp;
    const waBanner = !wa ? `<div class="banner warn">📱 <b>واتساب:</b> بانتظار أول رسالة. لو Meta لسه قافل الحساب، الوكلاء شغالين من هنا عادي.</div>`
      : wa.ok ? `<div class="banner ok">📱 <b>واتساب متصل</b> — آخر إرسال ناجح ${time(wa.at)}</div>`
      : `<div class="banner warn">📱 <b>واتساب موقوف من Meta</b> (${/131031/.test(wa.err) ? 'الحساب مقفول بانتظار التحقق' : 'خطأ في الإرسال'}). الوكلاء شغالين، وأول ما ينفك يرجع كل شي تلقائياً.</div>`;
    const infoBanner = t.hasInfo ? '' : `<div class="banner warn">⚙️ الوكلاء ما يعرفون شي عن نشاطك للحين. عبّ <a href="#" onclick="tab('settings');return false">معلومات النشاط</a> عشان يصيرون أذكى.</div>`;
    const go = { manager:'manager', messaging:'test', qa:'pending', secretary:'appts', exec:'manager', reports:'report', learning:'pending' };
    v.innerHTML = waBanner + infoBanner + `<div class="team">${t.agents.map(a => `
      <div class="agent-card" onclick="tab('${go[a.key]}')">
        <div class="top"><div class="ic">${a.icon}</div><div><h3>${a.name}</h3><div class="meta" style="margin:0"><span class="dot ${a.key === 'messaging' && wa && !wa.ok ? 'wait' : ''}"></span>${a.key === 'messaging' && wa && !wa.ok ? 'جاهز · بانتظار واتساب' : 'شغال'}</div></div></div>
        <div class="meta">${a.role}</div>
        <div><span class="big">${a.stat}</span> <span class="meta">${a.unit}</span></div>
        ${a.extra ? `<div class="meta" style="margin-top:4px">${esc(a.extra)}</div>` : ''}
        <div class="meta" style="margin-top:6px">آخر نشاط: ${a.last ? time(a.last) : '—'}</div>
      </div>`).join('')}</div>
      <div class="card"><b>📜 آخر نشاط الفريق</b><div class="feed" style="margin-top:8px">${t.activity.map(l => `<div><span class="meta">${time(l.at)}</span> — ${esc(l.text)}</div>`).join('') || '<div class="meta">ما فيه نشاط للحين</div>'}</div></div>`;
  } else if (current === 'manager') {
    if (!ownerChat) ownerChat = await api('/api/owner');
    v.innerHTML = `<div class="card">
      <p class="hint">اكتب أوامرك هنا بشكل طبيعي، والمدير يوزعها على الفريق. نفس الأوامر تشتغل من واتساب أول ما ينفك قفل Meta.</p>
      <div class="chips">${['احجز موعد مع أبو خالد بكرة الساعة 4 العصر','المواعيد','جهز عرض سعر لـ 50 قطعة','اكتب رسالة ترحيب للعملاء الجدد','تقرير'].map(x => `<button onclick="send('${x}')">${x}</button>`).join('')}</div>
      <div class="chat" id="chat">${ownerChat.map(m => `<div class="bubble ${m.role === 'owner' ? 'me' : 'agent'}">${esc(m.text)}</div>`).join('') || '<div class="empty">ابدأ بأمر…</div>'}</div>
      <div class="row"><input id="msg" placeholder="مثال: ذكرني أتصل بالمورد الخميس الساعة 10 الصبح" onkeydown="if(event.key==='Enter')send()"><button class="primary" onclick="send()">إرسال</button></div></div>`;
    scrollChat();
  } else if (current === 'pending') {
    v.innerHTML = state.pending.length ? state.pending.map(p => `
      <div class="card">
        <div class="meta"><span class="tag">#${p.id} · ${esc(p.category)}</span> — ${esc(p.name)} · ${time(p.at)}</div>
        <div><b>رسالته:</b> ${esc(p.customerText)}</div>
        ${p.reason ? `<div class="meta" style="margin-top:6px">السبب: ${esc(p.reason)}</div>` : ''}
        <textarea id="d${p.id}">${esc(p.draft)}</textarea>
        <div class="row"><button class="primary" onclick="approve(${p.id})">إرسال الرد</button><button class="danger" onclick="reject(${p.id})">رفض</button></div>
      </div>`).join('') : '<div class="empty">ما فيه طلبات تنتظرك 👍</div>';
  } else if (current === 'appts') {
    v.innerHTML = `<div class="card"><p class="hint">تقدر تضيف موعد من هنا، أو تكتبه للمدير بكلامك. يوصلك تذكير على واتساب قبل الموعد بساعة.</p>
      <div class="row" style="flex-wrap:wrap"><input id="at" type="datetime-local" style="flex:0 0 220px"><input id="tt" placeholder="عنوان الموعد"><button class="primary" onclick="addAppt()">إضافة</button></div></div>
      ${state.appts.length ? state.appts.map(a => `<div class="card row" style="justify-content:space-between">
        <div><b>${esc(a.title)}</b><div class="meta">#${a.id} · ${time(a.at)} ${a.customer ? '· ' + esc(a.customer) : ''} ${new Date(a.at) < Date.now() ? '· انتهى' : ''}</div></div>
        <button class="danger" onclick="delAppt(${a.id})">إلغاء</button></div>`).join('') : '<div class="empty">ما فيه مواعيد</div>'}`;
  } else if (current === 'test') {
    v.innerHTML = `<div class="card">
      <p class="hint">جرّب وكيل المراسلات كأنك عميل، بدون واتساب. الأسئلة العامة يرد عليها لحاله، والأسعار والمواعيد والشكاوى تروح لتبويب <b>الموافقات</b>.</p>
      <div class="chips">${['السلام عليكم','وش تسوون؟','كم سعر القطعة؟','أبي أحجز موعد زيارة','عندي شكوى على الطلب'].map(x => `<button onclick="sim('${x}')">${x}</button>`).join('')}</div>
      <div class="chat" id="chat">${testChat.map(m => `<div class="bubble ${m.r}">${esc(m.t)}</div>`).join('') || '<div class="empty">اكتب رسالة كأنك عميل…</div>'}</div>
      <div class="row"><input id="msg" placeholder="اكتب رسالة العميل" onkeydown="if(event.key==='Enter')sim()"><button class="primary" onclick="sim()">إرسال</button></div></div>`;
    scrollChat();
  } else if (current === 'convs') {
    const real = state.conversations.filter(c => !c.phone.startsWith('test'));
    v.innerHTML = real.length ? real.map(c => `
      <div class="card" onclick="openConv('${c.phone}')" style="cursor:pointer">
        <div class="meta">${esc(c.name)} · ${time(c.last?.at)}</div><div>${esc(c.last?.text).slice(0, 120)}</div>
      </div>`).join('') : '<div class="empty">ما فيه محادثات واتساب للحين</div>';
  } else if (current === 'report') {
    v.innerHTML = '<div class="card"><button class="primary" onclick="report()">اكتب تقرير اليوم</button><pre id="rep" style="margin-top:12px"></pre></div>';
  } else if (current === 'settings') {
    const s = await api('/api/settings');
    v.innerHTML = `<div class="card"><p class="hint">هذي المعلومات هي <b>المصدر الوحيد</b> اللي يعتمد عليه وكيل المراسلات ووكيل التنفيذ. اكتب: وش تبيعون، المنتجات، أوقات الدوام، الموقع، أرقام التواصل، طريقة الطلب والتوصيل. أي شي مو مكتوب هنا، الوكيل يحوّله لك للموافقة بدل ما يخترع.</p>
      <textarea id="bi" style="min-height:300px">${esc(s.businessInfo)}</textarea>
      <button class="primary" onclick="saveSettings()">حفظ</button></div>`;
  }
}
function scrollChat() { const c = document.getElementById('chat'); if (c) c.scrollTop = c.scrollHeight; const m = document.getElementById('msg'); if (m) m.focus(); }
async function send(x) {
  const el = document.getElementById('msg'), text = (x || el.value).trim(); if (!text) return;
  ownerChat.push({ role:'owner', text }, { role:'agent', text:'…' }); render();
  const r = await api('/api/owner', { text });
  ownerChat[ownerChat.length - 1].text = r.reply; await load(); render();
}
async function sim(x) {
  const el = document.getElementById('msg'), text = (x || el.value).trim(); if (!text) return;
  testChat.push({ r:'customer', t:text }, { r:'agent', t:'…' }); render();
  const r = await api('/api/simulate', { text, session:'dash' });
  testChat.pop();
  if (r.error) testChat.push({ r:'note', t:'خطأ: ' + r.error });
  else if (r.pending) testChat.push({ r:'note', t:`🟡 هذي تحتاج موافقتك (${r.category}) — انرسلت لتبويب الموافقات #${r.id}\nالمسودة: ${r.draft || '—'}` });
  else testChat.push({ r:'agent', t:r.reply || '—' });
  await load(); render();
}
async function openConv(phone) {
  const c = await api('/api/conversation/' + phone);
  document.getElementById('view').innerHTML = `<button onclick="render()">رجوع</button>
    <div class="card" style="margin-top:10px"><div class="meta">${esc(c.name)}</div><div class="chat">
    ${c.messages.map(m => `<div class="bubble ${m.role}">${esc(m.text)}</div>`).join('')}</div></div>`;
}
async function approve(id) { const r = await api('/api/approve/' + id, { text: document.getElementById('d' + id).value }); alert(r.message); await load(); render(); }
async function reject(id) { if (!confirm('ترفض هذا الطلب؟')) return; const r = await api('/api/reject/' + id, {}); alert(r.message); await load(); render(); }
async function addAppt() {
  const at = document.getElementById('at').value, title = document.getElementById('tt').value.trim();
  if (!at || !title) return alert('حدد الوقت والعنوان');
  const r = await api('/api/appointments', { datetime: at, title }); alert(r.message); await load(); render();
}
async function delAppt(id) { if (!confirm('تلغي الموعد؟')) return; const r = await api('/api/appointments/' + id, undefined, 'DELETE'); alert(r.message); await load(); render(); }
async function report() { const el = document.getElementById('rep'); el.textContent = 'جاري الكتابة…'; el.textContent = (await api('/api/report')).report; }
async function saveSettings() { const r = await api('/api/settings', { businessInfo: document.getElementById('bi').value }); alert(r.message); }
load().then(render);
setInterval(async () => { if (current === 'pending' || current === 'appts') return; await load(); if (current === 'team') render(); }, 30000);
</script>
</body>
</html>
