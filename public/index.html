<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سكرتيري</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="سكرتيري">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f766e">
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1c1f24;--muted:#6b7280;--line:#e5e7eb;--accent:#0f766e;--accent2:#14b8a6;--warn:#b45309;--bad:#b91c1c;--good:#15803d;--soft:#eef7f6}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#191c22;--text:#eef0f3;--muted:#9aa1ab;--line:#2a2f37;--accent:#2dd4bf;--accent2:#5eead4;--warn:#f59e0b;--bad:#f87171;--good:#4ade80;--soft:#132a28}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"SF Arabic","Segoe UI",Tahoma,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.hrow{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:auto;gap:10px}
h1{font-size:19px;margin:0}
.tabs{display:flex;gap:6px;overflow-x:auto;max-width:1100px;margin:10px auto 0;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;font-size:13px;padding:7px 11px}
main{padding:14px 16px 60px;max-width:1100px;margin:auto}
button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 12px;border-radius:10px;font-size:14px;cursor:pointer;font-family:inherit}
button.on,button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
@media (prefers-color-scheme:dark){button.on,button.primary{color:#062b27}}
button.danger{color:var(--bad)}
button.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.grid{display:grid;gap:10px}
.kpis{grid-template-columns:repeat(4,1fr);margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi b{display:block;font-size:20px;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12px}
.kpi.alert b{color:var(--warn)}
.team{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.agent{display:flex;gap:10px;align-items:flex-start}
.agent .ic{font-size:22px;width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:var(--soft);flex:none}
.agent h3{margin:0 0 2px;font-size:14px}
.meta{color:var(--muted);font-size:12px;line-height:1.6}
.two{grid-template-columns:1.3fr 1fr}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:14px;line-height:1.8}
.banner.warn{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.4)}
.banner.ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.35)}
code,.code{font-family:ui-monospace,Menlo,monospace;background:var(--soft);padding:2px 6px;border-radius:6px;font-size:13px;direction:ltr;unicode-bidi:embed;word-break:break-all}
.feed div{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.6}
.feed div:last-child{border:0}
pre,.pre{white-space:pre-wrap;font:inherit;margin:0;line-height:1.75}
.chat{min-height:45vh;max-height:62vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px;padding:4px}
.bubble{padding:10px 13px;border-radius:14px;max-width:88%;white-space:pre-wrap;line-height:1.75;font-size:14.5px}
.bubble.me{background:var(--accent);color:#fff;align-self:flex-start;border-bottom-right-radius:4px}
@media (prefers-color-scheme:dark){.bubble.me{color:#062b27}}
.bubble.ai{background:var(--card);border:1px solid var(--line);align-self:flex-end;border-bottom-left-radius:4px}
.bubble.wait{opacity:.6}
.bubble a{color:inherit}
.compose{display:flex;gap:8px;align-items:flex-end}
textarea,input,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--text);font:inherit;font-size:16px}
textarea{min-height:46px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips button{font-size:12.5px;padding:6px 10px;border-radius:999px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.toolbar input{flex:1;min-width:150px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.row .t{font-weight:600;font-size:14.5px;margin-bottom:3px}
.acts{display:flex;gap:6px;flex:none}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--accent);margin-inline-start:4px}
.pill.warn{background:rgba(245,158,11,.15);color:var(--warn)}
.pill.bad{background:rgba(239,68,68,.12);color:var(--bad)}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over i{background:var(--bad)}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,94vw);background:var(--card);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:18px}
dialog h3{margin:0 0 12px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.field.chk{display:flex;gap:8px;align-items:center}.field.chk input{width:auto}
.dlg-acts{display:flex;gap:8px;justify-content:flex-start;margin-top:14px}
h2{font-size:16px;margin:4px 0 10px}
.small{font-size:12.5px;color:var(--muted)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.kpi b{font-size:18px}}
</style>
</head>
<body>
<header>
  <div class="hrow"><h1>🧠 سكرتيري</h1><button class="sm" onclick="go(cur)">تحديث</button></div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="view"></main>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

<script>
const TABS = [
  ['home','🏠 الرئيسية'],['chat','💬 كلّم سكرتيرك'],['approvals','🟡 الموافقات'],['appointments','📅 المواعيد'],['reminders','⏰ التذكيرات'],
  ['tasks','✅ المهام'],['money','💰 فلوسي'],['bills','🧾 الفواتير'],['documents','🪪 الوثائق'],['occasions','🎂 المناسبات'],
  ['shopping','🛒 المقاضي'],['goals','🎯 الأهداف'],['trips','✈️ السفر'],['contacts','👥 جهات الاتصال'],['notes','📝 الملاحظات'],
  ['emails','📧 الإيميل'],['research','🔎 الأبحاث'],['members','🧑‍🔧 الأشخاص'],['runs','📜 سجل الفريق'],['settings','⚙️ الإعدادات']
];
let cur = location.hash.slice(1) || 'home';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtMoney = n => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
const fmtDT = t => t ? new Date(t).toLocaleString('ar-SA-u-nu-latn-ca-gregory', { timeZone:'Asia/Riyadh', weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : '';
const fmtD = t => t ? String(t).slice(0, 10) : '';
const toLocalInput = t => t ? new Date(new Date(t).getTime() + 3*3600e3).toISOString().slice(0, 16) : '';
const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
const daysLeft = d => d ? Math.round((new Date(String(d).slice(0,10) + 'T00:00:00+03:00') - new Date(new Date(Date.now()+3*3600e3).toISOString().slice(0,10) + 'T00:00:00+03:00')) / 864e5) : null;
async function api(url, body, method) {
  const opts = (body !== undefined || method) ? { method: method || 'POST', headers: { 'Content-Type': 'application/json' }, body: body !== undefined ? JSON.stringify(body) : undefined } : {};
  const r = await fetch(url, opts);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ('خطأ ' + r.status));
  return d;
}
function toast(msg) { alert(msg); }

// ============ تعريف الأقسام القابلة للإضافة والتعديل ============
const CAT = ['تموينات','خضار وفواكه','لحوم','منظفات','صيدلية','إلكترونيات','ملابس','أخرى'];
const E = {
  appointments: { title: 'موعد', fields: [['title','العنوان'],['at','الوقت','dt'],['location','المكان/الرابط'],['notes','ملاحظات','area']],
    row: r => [`${esc(r.title)}`, `${fmtDT(r.at)}${r.location ? ' · 📍' + esc(r.location) : ''}${r.gcal_id ? '<span class="pill">Google</span>' : ''}`] },
  reminders: { title: 'تذكير', fields: [['text','التذكير'],['at','الوقت','dt'],['repeat','التكرار','select',[['none','بدون'],['daily','يومي'],['weekdays','أيام العمل'],['weekly','أسبوعي'],['monthly','شهري'],['yearly','سنوي']]],['done','منتهي','bool']],
    row: r => [esc(r.text), `${fmtDT(r.at)}${r.repeat && r.repeat !== 'none' ? '<span class="pill">🔁 ' + esc(r.repeat) + '</span>' : ''}${r.done ? '<span class="pill">منتهي</span>' : ''}`] },
  tasks: { title: 'مهمة', fields: [['title','المهمة'],['details','التفاصيل','area'],['due_at','الموعد','dt'],['priority','الأولوية','select',[['normal','عادية'],['high','مهمة'],['urgent','عاجلة'],['low','منخفضة']]],['status','الحالة','select',[['todo','جديدة'],['doing','قيد التنفيذ'],['blocked','معلقة'],['done','منجزة']]],['assignee_id','إسناد لـ','ref:members']],
    row: r => [`${{urgent:'🔴',high:'🟠',normal:'🔵',low:'⚪'}[r.priority]||''} ${esc(r.title)}`, `${r.due_at ? fmtDT(r.due_at) : 'بدون موعد'}${r.assignee ? ' · ← ' + esc(r.assignee) : ''}<span class="pill ${r.status==='done'?'':r.due_at && new Date(r.due_at) < new Date() ? 'bad' : ''}">${{todo:'جديدة',doing:'قيد التنفيذ',blocked:'معلقة',done:'منجزة ✓'}[r.status]}</span>`],
    quick: r => r.status !== 'done' ? `<button class="sm" onclick="patch('tasks',${r.id},{status:'done'})">✓ خلصت</button>` : '' },
  expenses: { title: 'مصروف', fields: [['amount','المبلغ','num'],['category','التصنيف'],['vendor','الجهة/المتجر'],['date','التاريخ','date'],['note','ملاحظة']],
    row: r => [`${fmtMoney(r.amount)} ر.س — ${esc(r.category || '')}`, `${fmtD(r.date)} · ${esc(r.vendor || '')}${r.note ? ' · ' + esc(r.note) : ''}`] },
  income: { title: 'دخل', fields: [['amount','المبلغ','num'],['source','المصدر'],['date','التاريخ','date'],['note','ملاحظة']],
    row: r => [`+${fmtMoney(r.amount)} ر.س — ${esc(r.source || '')}`, `${fmtD(r.date)}${r.note ? ' · ' + esc(r.note) : ''}`] },
  bills: { title: 'فاتورة/اشتراك', fields: [['name','الاسم'],['amount','المبلغ','num'],['cycle','الدورة','select',[['monthly','شهري'],['yearly','سنوي'],['quarterly','ربعي'],['weekly','أسبوعي'],['once','مرة واحدة']]],['next_due','الاستحقاق القادم','date'],['category','التصنيف'],['autopay','يُخصم تلقائياً','bool'],['active','فعّال','bool'],['notes','ملاحظات','area']],
    row: r => { const d = daysLeft(r.next_due); return [`${esc(r.name)} — ${fmtMoney(r.amount)} ر.س`, `${{monthly:'شهري',yearly:'سنوي',quarterly:'ربعي',weekly:'أسبوعي',once:'مرة'}[r.cycle]||r.cycle}${r.next_due ? ' · ' + fmtD(r.next_due) : ''}${d !== null ? `<span class="pill ${d<0?'bad':d<=3?'warn':''}">${d<0?'متأخرة':d===0?'اليوم':'بعد '+d+' يوم'}</span>` : ''}${r.autopay ? '<span class="pill">تلقائي</span>' : ''}${!r.active ? '<span class="pill">موقوف</span>' : ''}`]; },
    quick: r => r.active ? `<button class="sm" onclick="payBill(${r.id})">✓ سددت</button>` : '' },
  documents: { title: 'وثيقة', fields: [['name','الوثيقة (جواز، إقامة، رخصة...)'],['holder','صاحبها'],['expires_on','تاريخ الانتهاء (ميلادي)','date'],['notes','ملاحظات: طريقة التجديد','area']],
    note: 'لا تكتب أرقام الهوية أو الجواز هنا — يكفي الاسم وتاريخ الانتهاء.',
    row: r => { const d = daysLeft(r.expires_on); return [`🪪 ${esc(r.name)}${r.holder ? ' (' + esc(r.holder) + ')' : ''}`, `${fmtD(r.expires_on)}${d !== null ? `<span class="pill ${d<0?'bad':d<=30?'warn':''}">${d<0?'منتهية':'باقي '+d+' يوم'}</span>` : ''}${r.notes ? ' · ' + esc(r.notes) : ''}`]; } },
  occasions: { title: 'مناسبة', fields: [['person','الشخص'],['type','النوع','select',[['birthday','عيد ميلاد'],['anniversary','ذكرى'],['other','أخرى']]],['month','الشهر (1-12)','num'],['day','اليوم','num'],['year','سنة الميلاد (اختياري)','num'],['notes','اهتماماته / أفكار هدايا','area']],
    row: r => [`🎂 ${esc(r.person)}`, `${r.day}/${r.month}${r.year ? ' · مواليد ' + r.year : ''} · ${{birthday:'عيد ميلاد',anniversary:'ذكرى',other:'مناسبة'}[r.type]||''}${r.notes ? ' · ' + esc(r.notes) : ''}`] },
  shopping: { title: 'غرض', fields: [['item','الغرض'],['qty','الكمية'],['category','القسم','select',CAT.map(c=>[c,c])],['store','المتجر'],['done','تم شراؤه','bool']],
    row: r => [`${r.done ? '✅ <s>' + esc(r.item) + '</s>' : '▫️ ' + esc(r.item)}${r.qty ? ' × ' + esc(r.qty) : ''}`, `${esc(r.category || '')}${r.store ? ' · ' + esc(r.store) : ''}`],
    quick: r => `<button class="sm" onclick="patch('shopping',${r.id},{done:${!r.done}})">${r.done ? '↩︎' : '✓'}</button>` },
  goals: { title: 'هدف', fields: [['title','الهدف'],['why','ليش؟','area'],['target','الرقم المستهدف','num'],['unit','الوحدة'],['period','الفترة','select',[['daily','يومي'],['weekly','أسبوعي'],['monthly','شهري'],['once','مرة واحدة']]],['deadline','الموعد النهائي','date'],['status','الحالة','select',[['active','نشط'],['paused','موقوف'],['done','تحقق']]]],
    row: r => [`🎯 ${esc(r.title)}`, `${r.target ? 'الهدف: ' + r.target + ' ' + esc(r.unit || '') + ' ' + ({daily:'يومياً',weekly:'أسبوعياً',monthly:'شهرياً',once:''}[r.period]||'') : ''} · المسجل: ${Number(r.total_logged||0)}${r.status!=='active'?'<span class="pill">'+esc(r.status)+'</span>':''}`] },
  trips: { title: 'رحلة', fields: [['title','العنوان'],['origin','من'],['destination','إلى'],['status','الحالة','select',[['planning','تخطيط'],['options_ready','خيارات جاهزة'],['booked','محجوزة'],['done','انتهت'],['cancelled','ملغاة']]],['notes','ملاحظات','area']],
    row: r => [`✈️ ${esc(r.title)}${r.destination ? ' — ' + esc(r.destination) : ''}`, `${r.depart_at ? fmtD(r.depart_at) : ''}${r.return_at ? ' ← ' + fmtD(r.return_at) : ''}<span class="pill">${esc(r.status)}</span>${(r.options||[]).length ? '<div class="pre small" style="margin-top:6px">' + r.options.map(o => `• ${esc(o.provider||o.type)}: ${esc(o.details)}${o.price ? ' — ' + fmtMoney(o.price) + ' ' + esc(o.currency||'') : ''}${o.link ? ' ' + rich(o.link) : ''}`).join('\n') + '</div>' : ''}`] },
  contacts: { title: 'جهة اتصال', fields: [['name','الاسم'],['relation','العلاقة','select',[['عائلة','عائلة'],['صديق','صديق'],['عمل','عمل'],['خدمات','خدمات وفنيين'],['أخرى','أخرى']]],['phone','الجوال'],['email','الإيميل'],['company','الجهة/المهنة'],['city','المدينة'],['notes','ملاحظات','area']],
    row: r => [`👤 ${esc(r.name)}${r.relation ? '<span class="pill">' + esc(r.relation) + '</span>' : ''}`, `${r.phone ? `<a href="tel:${esc(r.phone)}">${esc(r.phone)}</a>` : ''}${r.email ? ' · ' + esc(r.email) : ''}${r.company ? ' · ' + esc(r.company) : ''}${r.notes ? '<br>' + esc(r.notes) : ''}`] },
  notes: { title: 'ملاحظة', fields: [['title','العنوان'],['body','النص','area']], note: 'لا تحفظ كلمات سر أو أرقام بطاقات.',
    row: r => [`📝 ${esc(r.title || 'بدون عنوان')}`, `<div class="pre">${esc(String(r.body).slice(0, 400))}</div>`] },
  research: { title: 'بحث', fields: [['topic','الموضوع'],['summary','الخلاصة','area']], noAdd: true,
    row: r => [`🔎 ${esc(r.topic)}`, `<div class="pre">${rich(String(r.summary || '').slice(0, 1200))}</div>`] },
  members: { title: 'شخص', fields: [['name','الاسم'],['role','الدور (سائق، عامل، أخ...)'],['phone','الجوال'],['email','الإيميل'],['active','فعّال','bool']],
    note: 'الأشخاص اللي تسند لهم مهام (سائق، عاملة، أحد أفراد العائلة). كل واحد يربط تيليجرام بكود ويستلم مهامه.',
    row: r => [`🧑 ${esc(r.name)}${r.role ? ' — ' + esc(r.role) : ''}`, `${r.on_telegram ? '<span class="pill">مربوط بتيليجرام ✓</span>' : r.link_code ? `كود الربط: يرسل للبوت <code>/start ${esc(r.link_code)}</code>` : ''}${r.phone ? ' · ' + esc(r.phone) : ''}`] },
  emails: { title: 'إيميل', fields: [['handled','تمت معالجته','bool']], noAdd: true,
    row: r => [`${r.important ? '⭐ ' : ''}${esc(r.subject)}`, `${esc(r.from_addr)} · ${fmtDT(r.at)}<span class="pill">${esc(r.category || '')}</span>${r.handled ? '<span class="pill">تم</span>' : ''}${r.summary ? '<br>' + esc(r.summary) : ''}`] },
  runs: { title: 'تشغيل', fields: [], noAdd: true, noEdit: true,
    row: r => [`${{manager:'🧠',secretary:'📅',travel:'✈️',money:'💰',shopping:'🛒',writer:'✍️',planner:'🎯',research:'🔎',reception:'💬'}[r.agent]||'🤖'} ${esc(r.agent)} — ${esc(String(r.input||'').slice(0, 120))}`,
      `${fmtDT(r.started_at)} · ${(r.steps||[]).length} خطوة · ${r.status === 'error' ? '<span class="pill bad">خطأ</span>' : '<span class="pill">تم</span>'}<details><summary class="small">التفاصيل</summary><div class="pre small">${(r.steps||[]).map(s => `${s.ok === false ? '❌' : '✔︎'} ${esc(s.tool)} ${esc(JSON.stringify(s.input||{}).slice(0, 160))}`).join('\n')}\n\n${rich(r.output || '')}</div></details>`] }
};

// ============ التنقل ============
function renderTabs() {
  $('#tabs').innerHTML = TABS.map(([k, l]) => `<button class="${k === cur ? 'on' : ''}" onclick="go('${k}')">${l}</button>`).join('');
  const on = $('#tabs .on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
}
async function go(k) {
  cur = k; location.hash = k; renderTabs();
  const v = $('#view'); v.innerHTML = '<div class="empty">⏳</div>';
  try {
    if (k === 'home') return await home(v);
    if (k === 'chat') return await chat(v);
    if (k === 'approvals') return await approvals(v);
    if (k === 'money') return await money(v);
    if (k === 'settings') return await settings(v);
    if (E[k]) return await list(v, k);
  } catch (e) { v.innerHTML = `<div class="banner warn">⚠️ ${esc(e.message)}</div>`; }
}

let pendingFile = null;
async function chat(v) {
  const hist = await api('/api/owner');
  v.innerHTML = `<div class="card"><div class="chat" id="chatbox">${hist.map(m => `<div class="bubble ${m.role === 'owner' ? 'me' : 'ai'}">${rich(m.text)}</div>`).join('') || '<div class="empty">قل لي أي شي تبيه... صغير أو كبير 👇</div>'}</div>

    <div class="compose"><label class="sm" style="cursor:pointer;padding:10px;border:1px solid var(--line);border-radius:10px" title="أرفق صورة أو PDF">📎<input type="file" accept="image/*,application/pdf" hidden onchange="pickFile(this)"></label>
    <textarea id="msg" rows="1" placeholder="اكتب طلبك..." onkeydown="if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();send()}"></textarea>
    <button class="primary" onclick="send()">إرسال</button></div><div class="small" id="filelabel"></div></div>`;
  const box = $('#chatbox'); box.scrollTop = box.scrollHeight;
}
function pickFile(inp) {
  const f = inp.files[0]; if (!f) return;
  if (f.size > 15e6) return toast('الملف كبير (الحد 15MB)');
  const r = new FileReader();
  r.onload = () => { pendingFile = { type: f.type, data: String(r.result).split(',')[1], name: f.name }; $('#filelabel').textContent = '📎 ' + f.name; };
  r.readAsDataURL(f);
}
async function send() {
  const t = $('#msg').value.trim(); if (!t && !pendingFile) return;
  const box = $('#chatbox'); if (box.querySelector('.empty')) box.innerHTML = '';
  box.insertAdjacentHTML('beforeend', `<div class="bubble me">${rich(t || '')}${pendingFile ? '<br>📎 ' + esc(pendingFile.name) : ''}</div><div class="bubble ai wait" id="w">⏳ الفريق يشتغل...</div>`);
  box.scrollTop = box.scrollHeight; $('#msg').value = '';
  const file = pendingFile; pendingFile = null; $('#filelabel').textContent = '';
  try { const r = await api('/api/owner', { text: t, file }); $('#w').outerHTML = `<div class="bubble ai">${rich(r.reply)}</div>`; }
  catch (e) { $('#w').outerHTML = `<div class="bubble ai">⚠️ ${esc(e.message)}</div>`; }
  box.scrollTop = box.scrollHeight;
}

let members = null;
async function edit(ent, r = {}) {
  const def = E[ent];
  if (def.fields.some(f => f[2] === 'ref:members') && !members) members = await api('/api/e/members');
  const inp = ([k, label, type, opts]) => {
    const val = r[k];
    if (type === 'area') return `<div class="field"><label>${label}</label><textarea name="${k}" rows="3">${esc(val)}</textarea></div>`;
    if (type === 'bool') return `<div class="field chk"><input type="checkbox" name="${k}" ${val || (val === undefined && k === 'active') ? 'checked' : ''}><label>${label}</label></div>`;
    if (type === 'select') return `<div class="field"><label>${label}</label><select name="${k}">${opts.map(([v, l]) => `<option value="${esc(v)}" ${String(val) === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>`;
    if (type === 'ref:members') return `<div class="field"><label>${label}</label><select name="${k}"><option value="">— أنا —</option>${members.map(m => `<option value="${m.id}" ${val == m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join('')}</select></div>`;
    const t = type === 'dt' ? 'datetime-local' : type === 'date' ? 'date' : type === 'num' ? 'number' : 'text';
    const vv = type === 'dt' ? toLocalInput(val) : type === 'date' ? fmtD(val) : (val ?? '');
    return `<div class="field"><label>${label}</label><input type="${t}" ${t === 'number' ? 'step="any"' : ''} name="${k}" value="${esc(vv)}"></div>`;
  };
  $('#dlgForm').innerHTML = `<h3>${r.id ? 'تعديل' : 'إضافة'} ${def.title}</h3>${def.fields.map(inp).join('')}
    <div class="dlg-acts"><button class="primary" value="ok">حفظ</button><button value="cancel" formnovalidate>إلغاء</button></div>`;
  $('#dlg').showModal();
  $('#dlg').onclose = async () => {
    if ($('#dlg').returnValue !== 'ok') return;
    const fd = new FormData($('#dlgForm')), body = {};
    for (const [k, , type] of def.fields) {
      if (type === 'bool') body[k] = fd.get(k) === 'on';
      else { const x = fd.get(k); body[k] = type === 'num' ? (x === '' ? null : Number(x)) : x; }
    }
    try { r.id ? await api(`/api/e/${ent}/${r.id}`, body, 'PATCH') : await api(`/api/e/${ent}`, body); go(cur); }
    catch (e) { toast('⚠️ ' + e.message); }
  };
}

  if (w.connected) { box.innerHTML = `✅ <b>متصل</b> — كلم سكرتيرك من رقمك ${w.owner_phone ? '(المسجل: ' + esc(w.owner_phone) + ')' : '<span style="color:var(--bad)">(حدد OWNER_PHONE)</span>'} على رقم السكرتير.<div style="margin-top:8px"><button class="sm danger" onclick="if(confirm('تفصل رقم السكرتير؟'))api('/api/whatsapp/logout',{}).then(loadWA)">فصل الرقم</button></div>`; return; }
  const q = await api('/api/whatsapp/qr').catch(e => ({ error: e.message }));
  box.innerHTML = `الحالة: ${esc(w.state)}<br><b>اربط رقم السكرتير:</b> افتح واتساب على جوال رقم السكرتير ← الإعدادات ← الأجهزة المرتبطة ← ربط جهاز ← امسح الرمز:<br>` +
    (q.base64 ? `<img src="${q.base64.startsWith('data:') ? q.base64 : 'data:image/png;base64,' + q.base64}" style="width:260px;max-width:100%;background:#fff;padding:8px;border-radius:12px;margin-top:8px">` : `<div style="color:var(--bad)">${esc(q.error || 'ما طلع رمز، جرب تحديث')}</div>`) +
    `<div class="small">الرمز يتجدد تلقائياً كل 20 ثانية.</div>`;
}
async function saveSettings() {
  await api('/api/settings', {
    profile: { name: $('#p_name').value, city: $('#p_city').value, home_airport: $('#p_air').value, family: $('#p_family').value, preferences: $('#p_pref').value, signature: $('#p_sig').value },
    autonomy: { level: $('#a_level').value, approval_threshold: Number($('#a_thr').value) || 0, max_discount_pct: 0, auto_followup: false, followup_after_days: 3, auto_invoice_reminders: false },
    morning_hour: Number($('#h_m').value), report_hour: Number($('#h_r').value)
  });
  toast('✅ انحفظت');
}
async function rotateHook() { if (!confirm('الرابط القديم بيوقف، ولازم تحدث الاختصارات. متأكد؟')) return; const r = await api('/api/shortcut/rotate', {}); $('#hook').textContent = r.url; }

renderTabs(); go(cur);
window.addEventListener('hashchange', () => { const k = location.hash.slice(1); if (k && k !== cur) go(k); });
</script>
